{% extends 'base.html' %}

{% block title %}Register - Student Complaint System{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Student Registration</h2>
      <p>Create an account to submit & track complaints</p>
    </div>

    <form method="POST" action="{% url 'user_register' %}" id="registerForm">
      {% csrf_token %}
      
      <div class="form-group">
        <label class="form-label" for="name"><i class="fa-solid fa-user"></i> Full Name</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Alex Morgan" value="{{ name|default:'' }}" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="student@college.edu" value="{{ email|default:'' }}" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password"><i class="fa-solid fa-lock"></i> Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password"><i class="fa-solid fa-lock"></i> Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
        <i class="fa-solid fa-user-plus"></i> Register Account
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{% url 'user_login' %}">Login here</a>
    </div>
  </div>
</div>
{% endblock %}
