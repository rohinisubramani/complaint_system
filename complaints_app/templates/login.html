{% extends 'base.html' %}

{% block title %}Login - Student Complaint System{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Student Login</h2>
      <p>Access your dashboard and submitted tickets</p>
    </div>

    <form method="POST" action="{% url 'user_login' %}">
      {% csrf_token %}

      <div class="form-group">
        <label class="form-label" for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="student@college.edu" value="{{ email|default:'' }}" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password"><i class="fa-solid fa-lock"></i> Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
        <i class="fa-solid fa-right-to-bracket"></i> Login to Dashboard
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="{% url 'user_register' %}">Register here</a>
      <div style="margin-top: 0.75rem;">
        <a href="{% url 'admin_login' %}" style="color: #6b21a8; font-weight: 500;"><i class="fa-solid fa-shield-halved"></i> Administrator Login Portal</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
